<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>손맛분식 고객응대 챗봇</title>
    <!-- Tailwind CSS for modern responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts for friendly, warm typography -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
        }
        /* Custom scrollbar for chat container */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff7ed;
        }
        ::-webkit-scrollbar-thumb {
            background: #fdba74;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #f97316;
        }
    </style>
</head>
<body class="bg-orange-50 h-screen flex flex-col justify-between overflow-hidden">

    <!-- Header: Shop Information -->
    <header class="bg-gradient-to-r from-orange-500 to-amber-500 text-white shadow-md p-4 flex flex-col items-center justify-center shrink-0">
        <div class="max-w-md w-full flex items-center justify-between">
            <div>
                <span class="bg-orange-600 text-xs px-2 py-0.5 rounded-full font-medium inline-block mb-1">달빛시장 3번 골목</span>
                <h1 class="text-xl font-bold">손맛분식 챗봇 🥟</h1>
            </div>
            <div class="text-right text-xs bg-orange-600/40 p-2 rounded-xl backdrop-blur-sm">
                <p class="font-semibold">영업시간</p>
                <p>평일 10:00 ~ 20:00</p>
                <p class="text-orange-200">일요일 휴무</p>
            </div>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main id="chatContainer" class="flex-1 max-w-md w-full mx-auto p-4 overflow-y-auto flex flex-col space-y-3">
        <!-- Welcome Message from Bot -->
        <div class="flex items-start space-x-2">
            <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow">손</div>
            <div class="bg-white border border-orange-100 rounded-2xl rounded-tl-none p-3.5 shadow-sm max-w-[80%] text-sm text-gray-800 leading-relaxed">
                안녕하세요! 달빛시장 3번 골목 <b>손맛분식</b>입니다. 😊<br>
                궁금하신 점을 편하게 물어보세요! 아래 자주 묻는 질문 버튼을 누르셔도 답변을 확인하실 수 있어요.
            </div>
        </div>
    </main>

    <!-- Quick FAQ Buttons Bar (4 buttons) -->
    <div class="max-w-md w-full mx-auto px-4 py-2 shrink-0">
        <p class="text-xs text-orange-700 font-semibold mb-1.5 px-1">✨ 자주 묻는 질문</p>
        <div id="quickFaqGrid" class="grid grid-cols-2 gap-2">
            <!-- Dynamically populated via JS -->
        </div>
    </div>

    <!-- Input Footer -->
    <footer class="bg-white border-t border-orange-100 p-3 shadow-lg shrink-0">
        <form id="chatForm" class="max-w-md mx-auto flex items-center space-x-2">
            <input 
                type="text" 
                id="userInput" 
                placeholder="질문을 입력해주세요 (예: 영업시간, 포장 되나요?)" 
                class="flex-1 bg-orange-50 border border-orange-200 text-gray-800 text-sm rounded-full px-4 py-3 focus:outline-none focus:ring-2 focus:ring-orange-500 focus:bg-white transition-all"
                autocomplete="off"
            >
            <button 
                type="submit" 
                class="bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white px-5 py-3 rounded-full font-medium text-sm shadow-md transition-all active:scale-95 flex items-center justify-center shrink-0">
                보내기
            </button>
        </form>
    </footer>

    <script>
        // FAQ Database containing 10 precise questions and answers
        const faqDatabase = [
            {
                keywords: ["시간", "영업", "몇시", "언제", "오픈", "마감", "까지"],
                question: "몇 시까지 하세요?",
                answer: "평일은 10시부터 20시까지, 토요일은 21시까지입니다. 일요일은 쉽니다."
            },
            {
                keywords: ["메뉴", "음식", "판", "종류", "김밥", "떡볶이", "튀김", "순대", "뭐가"],
                question: "어떤 메뉴가 있나요?",
                answer: "매콤달콤 쌀떡볶이, 속이 꽉 찬 수제김밥, 바삭한 모듬튀김과 쫄깃한 순대를 판매하고 있습니다!"
            },
            {
                keywords: ["포장", "싸", "가지고", "테이크아웃"],
                question: "포장 되나요?",
                answer: "네, 모든 메뉴 포장 가능합니다! 미리 전화 주시면 기다리지 않고 바로 찾아가실 수 있어요."
            },
            {
                keywords: ["위치", "어디", "찾아", "골목", "주소", "길"],
                question: "가게 위치가 어디인가요?",
                answer: "달빛시장 3번 골목 안쪽으로 들어오시면 주황색 간판의 '손맛분식'을 쉽게 찾으실 수 있습니다."
            },
            {
                keywords: ["주차", "차", "세울", "공간"],
                question: "주차장은 있나요?",
                answer: "전통시장 공영주차장을 이용하시면 편리합니다. (구매 고객 주차권 문의는 매장으로 부탁드려요)"
            },
            {
                keywords: ["휴무", "쉬는", "날", "일요일", "쉬나요"],
                question: "휴무일이 언제인가요?",
                answer: "매주 일요일은 정기 휴무입니다. 맛있는 분식을 위해 일요일은 쉬어갑니다!"
            },
            {
                keywords: ["예약", "단체", "주문", "많이"],
                question: "단체 주문도 되나요?",
                answer: "네, 단체 간식 및 예약 주문도 환영합니다. 하루 전날 미리 연락해 주시면 정성껏 준비해 드립니다."
            },
            {
                keywords: ["전화", "번호", "연락처", "문의"],
                question: "전화번호가 어떻게 되나요?",
                answer: "가게 연락처는 010-XXXX-XXXX입니다. 궁금한 점이 있으시면 편하게 전화 주세요!"
            },
            {
                keywords: ["카드", "현금", "결제", "계좌", "페이", "제로페이"],
                question: "카드 결제 되나요?",
                answer: "네, 신용카드 결제 및 온누리상품권, 제로페이 모두 사용 가능합니다."
            },
            {
                keywords: ["배달", "배민", "쿠팡", "요기요", "집", "배달되나요"],
                question: "배달도 되나요?",
                answer: "죄송합니다만 현재 배달 대행 서비스는 운영하지 않고 있으며, 직접 방문 포장만 가능합니다."
            }
        ];

        // UI Element References
        const chatContainer = document.getElementById('chatContainer');
        const chatForm = document.getElementById('chatForm');
        const userInput = document.getElementById('userInput');
        const quickFaqGrid = document.getElementById('quickFaqGrid');

        // Initialize 4 prominent quick FAQ buttons at startup
        function initQuickFaqs() {
            // Select 4 representative FAQs to show as quick buttons
            const defaultFaqs = [
                faqDatabase[0], // 영업시간
                faqDatabase[1], // 메뉴
                faqDatabase[2], // 포장
                faqDatabase[3]  // 위치
            ];

            quickFaqGrid.innerHTML = '';
            defaultFaqs.forEach(faq => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'bg-white hover:bg-orange-100 text-orange-800 text-xs font-medium py-2 px-3 rounded-xl border border-orange-200 shadow-sm transition-all text-left truncate active:scale-95';
                btn.textContent = `💡 ${faq.question}`;
                btn.onclick = () => handleUserQuery(faq.question);
                quickFaqGrid.appendChild(btn);
            });
        }

        // Append message to chat container
        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex items-start space-x-2 ${isUser ? 'justify-end' : ''}`;

            if (!isUser) {
                messageDiv.innerHTML = `
                    <div class="w-8 h-8 rounded-full bg-orange-500 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow">손</div>
                    <div class="bg-white border border-orange-100 rounded-2xl rounded-tl-none p-3.5 shadow-sm max-w-[80%] text-sm text-gray-800 leading-relaxed">
                        ${text}
                    </div>
                `;
            } else {
                messageDiv.innerHTML = `
                    <div class="bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-2xl rounded-tr-none p-3.5 shadow-sm max-w-[80%] text-sm leading-relaxed">
                        ${text}
                    </div>
                    <div class="w-8 h-8 rounded-full bg-amber-600 text-white flex items-center justify-center font-bold text-sm shrink-0 shadow">나</div>
                `;
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Core matching engine: finds best FAQ match or returns default fallback
        function findFaqAnswer(query) {
            const cleanQuery = query.toLowerCase().trim();
            if (!cleanQuery) return null;

            let bestMatch = null;
            let maxScore = 0;

            for (const item of faqDatabase) {
                let score = 0;
                for (const keyword of item.keywords) {
                    if (cleanQuery.includes(keyword)) {
                        score += keyword.length; // Longer keyword match weights higher
                    }
                }
                if (score > maxScore) {
                    maxScore = score;
                    bestMatch = item;
                }
            }

            // If a reasonable keyword match is found
            if (maxScore > 0 && bestMatch) {
                return bestMatch.answer;
            }

            // Fallback requirement specified by user
            return "확인이 어렵습니다. 사장님께 직접 여쭤봐 주세요";
        }

        // Handle user query submission
        function handleUserQuery(queryText) {
            if (!queryText.trim()) return;

            // 1. Show user message
            appendMessage('user', queryText);
            userInput.value = '';

            // 2. Simulate short conversational delay for realism, then show bot reply
            setTimeout(() => {
                const answer = findFaqAnswer(queryText);
                appendMessage('bot', answer);
            }, 400);
        }

        // Form submit listener
        chatForm.onsubmit = (e) => {
            e.preventDefault();
            handleUserQuery(userInput.value);
        };

        // Run initialization on load
        window.onload = () => {
            initQuickFaqs();
        };
    </script>
</body>
</html>
